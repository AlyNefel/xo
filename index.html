<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon XO Game</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        
        <!-- Header Section -->
        <div class="text-center mb-4 header-section">
            <h1 class="display-3 fw-bold game-title">
                <span class="x-text">X</span><span class="o-text">O</span> Showdown
            </h1>
            <p class="lead text-muted">A beautiful Tic-Tac-Toe experience</p>
        </div>

        <!-- Controls / Mode Selection -->
        <div class="mode-selection mb-4 d-flex gap-3">
            <button id="btn-pvp" class="btn btn-outline-primary active mode-btn">Play vs Friend</button>
            <button id="btn-pva" class="btn btn-outline-danger mode-btn">Play vs Robot</button>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard d-flex justify-content-between mb-4 px-4 py-2 rounded-pill shadow-sm">
            <div class="score-item text-center">
                <span class="score-label x-text">Player X</span>
                <div id="score-x" class="score-value fs-4 fw-bold">0</div>
            </div>
            <div class="score-item text-center mx-4">
                <span class="score-label text-white">Ties</span>
                <div id="score-tie" class="score-value fs-4 fw-bold text-white">0</div>
            </div>
            <div class="score-item text-center">
                <span class="score-label o-text">Player O</span>
                <div id="score-o" class="score-value fs-4 fw-bold">0</div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="board-container">
            <div id="board" class="board">
                <!-- Cells -->
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
                <!-- Winning Line -->
                <div id="winning-line" class="winning-line"></div>
            </div>
        </div>

        <!-- Turn Indicator -->
        <div class="turn-indicator mt-4 mb-3">
            <h4 id="turn-text" class="fw-semibold">Player <span class="x-text">X</span>'s Turn</h4>
        </div>

        <!-- Restart Button -->
        <button id="btn-restart" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">
            Restart Game
        </button>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
