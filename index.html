<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon XO Multiplayer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Overlay: Nickname Entry -->
    <div id="nickname-overlay" class="overlay active d-flex flex-column justify-content-center align-items-center">
        <div class="overlay-card text-center p-5 rounded-4 shadow-lg">
            <h2 class="mb-4 fw-bold">Enter Your Nickname</h2>
            <input type="text" id="nickname-input" class="form-control form-control-lg mb-3 text-center" placeholder="Player Name" maxlength="15">
            <button id="btn-join" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold w-100">Find Match</button>
        </div>
    </div>

    <!-- Overlay: Waiting for Opponent -->
    <div id="waiting-overlay" class="overlay d-flex flex-column justify-content-center align-items-center">
        <div class="overlay-card text-center p-5 rounded-4 shadow-lg">
            <h2 class="mb-4 fw-bold">Waiting for opponent...</h2>
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-4 text-muted">We are matching you with another player.</p>
        </div>
    </div>

    <!-- Overlay: Opponent Disconnected -->
    <div id="disconnect-overlay" class="overlay d-flex flex-column justify-content-center align-items-center">
        <div class="overlay-card text-center p-5 rounded-4 shadow-lg">
            <h2 class="mb-4 fw-bold text-danger">Opponent Disconnected</h2>
            <p class="mt-2 text-muted">The other player has left the game.</p>
            <button id="btn-rejoin" class="btn btn-danger btn-lg rounded-pill px-5 fw-bold mt-3">Find New Match</button>
        </div>
    </div>


    <div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center">
        
        <!-- Header Section -->
        <div class="text-center mb-4 header-section">
            <h1 class="display-3 fw-bold game-title">
                <span class="x-text">X</span><span class="o-text">O</span> Multiplayer
            </h1>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard d-flex justify-content-between align-items-center mb-4 px-4 py-2 rounded-pill shadow-sm w-100" style="max-width: 500px;">
            <div class="score-item text-center">
                <span id="name-x" class="score-label x-text fs-5">Player X</span>
            </div>
            <div class="score-item text-center mx-4">
                <span class="score-label text-white fw-bold fs-4">VS</span>
            </div>
            <div class="score-item text-center">
                <span id="name-o" class="score-label o-text fs-5">Player O</span>
            </div>
        </div>

        <!-- Game Board -->
        <div class="board-container">
            <div id="board" class="board">
                <!-- Cells -->
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
                <!-- Winning Line -->
                <div id="winning-line" class="winning-line"></div>
            </div>
        </div>

        <!-- Turn Indicator -->
        <div class="turn-indicator mt-4 mb-3">
            <h4 id="turn-text" class="fw-semibold">Waiting to start...</h4>
        </div>

    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
